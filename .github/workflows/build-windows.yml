name: Build Money Engine for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Get source
        uses: actions/checkout@v4
      - name: Install build Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build EXE, test it and create ZIP
        shell: pwsh
        run: ./packaging/build-windows.ps1
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: MoneyEngine-Windows
          path: dist/MoneyEngine-Windows.zip
          if-no-files-found: error
